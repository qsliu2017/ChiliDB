[workspace]
members = ["crates/common", "crates/peg", "crates/parser", "crates/binder", "crates/planner", "crates/optimizer", "crates/executor", "crates/storage", "crates/heapam", "crates/catalog"]
resolver = "3"

[workspace.dependencies]
arrow-schema = "=59.3.0"
arrow-array = "=59.3.0"
datafusion = { version = "=55.1.0", default-features = false }
datafusion-common = { version = "=55.1.0", default-features = false }
datafusion-expr = { version = "=55.1.0", default-features = false, features = ["recursive_protection"] }
datafusion-functions-aggregate = { version = "=55.1.0", default-features = false }
datafusion-functions-window = { version = "=55.1.0", default-features = false }
datafusion-optimizer = { version = "=55.1.0", features = ["recursive_protection"] }

[package]
name = "chilidb"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
chilidb-common = { path = "crates/common" }
chilidb-binder = { path = "crates/binder" }
chilidb-parser = { path = "crates/parser" }
chilidb-planner = { path = "crates/planner" }
chilidb-optimizer = { path = "crates/optimizer" }
chilidb-executor = { path = "crates/executor" }
chilidb-storage = { path = "crates/storage" }
chilidb-heapam = { path = "crates/heapam" }
chilidb-catalog = { path = "crates/catalog" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
arrow-schema.workspace = true
datafusion-common.workspace = true
datafusion-expr.workspace = true
datafusion-optimizer.workspace = true
